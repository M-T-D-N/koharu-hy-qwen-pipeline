name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run sidecar tests
        run: python -m unittest discover -v
      - name: Compile Python sources
        run: >-
          python -m py_compile
          service/server.py
          service/test_server.py
          scripts/download-model.py
          scripts/hy-translate-request.py

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw ($errors | Out-String)
            }
          }
      - name: Run launcher logic tests
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\tests\launcher-core.tests.ps1
      - name: Apply pinned Koharu patch to its exact upstream commit
        shell: pwsh
        run: |
          git init .koharu-patch-check
          git -C .koharu-patch-check remote add origin https://github.com/mayocream/koharu.git
          git -C .koharu-patch-check fetch --depth 1 origin a81c5829ea99a45e04580ff97fd6affa81b2db34
          git -C .koharu-patch-check checkout --detach FETCH_HEAD
          pwsh -NoProfile -File .\scripts\apply-koharu-patch.ps1 -KoharuCheckout .\.koharu-patch-check
          git -C .koharu-patch-check diff --check
